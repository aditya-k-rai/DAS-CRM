services:
  - type: web
    name: nexcrm-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && chmod +x node_modules/.bin/* && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: nexcrm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nexcrm-db
    plan: free
    databaseName: nexcrm
    user: postgres
