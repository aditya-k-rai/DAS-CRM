# =============================================================================
# DAS CRM — Cross-Platform Desktop Build Pipeline
# Produces:
#   1. DASCRM-Windows.exe  — Windows 64-bit standalone executable
#   2. DASCRM-macOS.dmg    — macOS disk image installer (Apple Silicon + Intel)
# =============================================================================

name: Build Desktop Installers (Windows & macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================================
  # WINDOWS BUILD (Single .exe)
  # ===========================================================================
  build-windows:
    name: "Windows Desktop App"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r Win/requirements.txt

      - name: Ensure resources directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "Win/resources" | Out-Null

      - name: Build Windows executable
        working-directory: Win
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: python build_exe.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-Windows
          path: |
            Win/dist/DASCRM-Windows.exe
            Win/dist/DASCRM.exe
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # MACOS BUILD (Single .dmg via native hdiutil)
  # ===========================================================================
  build-macos:
    name: "macOS Desktop App"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcode-select --print-path
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        working-directory: macOs
        run: |
          swift package tools-version --set 5.9
          swift package resolve

      - name: Build macOS Swift executable (release)
        working-directory: macOs
        run: swift build --configuration release

      - name: Assemble DASCRM.app bundle & DMG
        run: |
          APP="$RUNNER_TEMP/DASCRM.app"
          BIN_PATH=$(find macOs/.build -type f -name "DASCRM" 2>/dev/null | grep -E "release/DASCRM" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find macOs/.build -type f -name "DASCRM" 2>/dev/null | head -n 1)
          fi
          echo "Found macOS binary at: $BIN_PATH"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp "$BIN_PATH" "$APP/Contents/MacOS/DASCRM"
          chmod +x "$APP/Contents/MacOS/DASCRM"

          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>             <string>DASCRM</string>
            <key>CFBundleDisplayName</key>      <string>DAS CRM</string>
            <key>CFBundleIdentifier</key>       <string>com.dascrm.app</string>
            <key>CFBundleVersion</key>          <string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleExecutable</key>       <string>DASCRM</string>
            <key>CFBundlePackageType</key>      <string>APPL</string>
            <key>LSMinimumSystemVersion</key>   <string>12.0</string>
            <key>NSHighResolutionCapable</key>  <true/>
          </dict>
          </plist>
          PLIST

          # Create DMG directly with native Apple hdiutil (fast, reliable, no brew dependencies)
          hdiutil create -volname "DAS CRM" -srcfolder "$APP" -ov -format UDZO DASCRM-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-macOS
          path: DASCRM-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # RELEASE (Publish GitHub Release on tag)
  # ===========================================================================
  release:
    name: "Publish GitHub Release"
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: "DASCRM-*"
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: "DAS CRM ${{ github.ref_name }}"
          body: |
            ## DAS CRM ${{ github.ref_name }} Desktop Release

            ### Downloads
            | Platform | File | Description |
            |---|---|---|
            | Windows | `DASCRM-Windows.exe` | Standalone executable for 64-bit Windows PCs |
            | macOS | `DASCRM-macOS.dmg` | Disk image installer for macOS 12+ (Intel & Apple Silicon) |

            > Built automatically by GitHub Actions from commit `${{ github.sha }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
