# ─────────────────────────────────────────────────────────────────────────────
# DAS CRM — Cross-Platform Desktop Build Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Triggers on every push to `main` and on manual dispatch.
# Produces four downloadable artifacts visible under "Actions > Artifacts":
#   • DASCRM-x64.exe        — Windows x86_64 standalone executable
#   • DASCRM-x86.exe        — Windows x86 (32-bit) standalone executable
#   • DASCRM-universal.exe  — Windows all-architectures standalone executable
#   • DASCRM-macOS.dmg      — macOS disk image installer
#
# All four build jobs run IN PARALLEL to minimise total wall-clock time.
# ─────────────────────────────────────────────────────────────────────────────

name: Build Desktop Installers (Windows .exe ×3 & macOS .dmg)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# WINDOWS BUILD JOBS — run in parallel
# ─────────────────────────────────────────────────────────────────────────────

  build-windows-x64:
    name: "Windows x86_64"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r Win/requirements.txt
      - name: Ensure resources directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "Win/resources" | Out-Null
      - name: Build x64 exe
        working-directory: Win
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: python build_all.py x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-x64
          path: Win/dist/DASCRM-x64.exe
          if-no-files-found: error
          retention-days: 30

  build-windows-x86:
    name: "Windows x86 (32-bit)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r Win/requirements.txt
      - name: Ensure resources directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "Win/resources" | Out-Null
      - name: Build x86 exe
        working-directory: Win
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: python build_all.py x86 || echo "x86 build skipped (32-bit Python not available)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-x86
          path: Win/dist/DASCRM-x86.exe
          if-no-files-found: ignore
          retention-days: 30

  build-windows-universal:
    name: "Windows Universal"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r Win/requirements.txt
      - name: Ensure resources directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "Win/resources" | Out-Null
      - name: Build universal exe
        working-directory: Win
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: python build_all.py universal
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-universal
          path: Win/dist/DASCRM-universal.exe
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # macOS  (.dmg via Swift Package Manager + create-dmg)
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: "macOS"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Swift versions
        run: |
          xcode-select --print-path
          xcodebuild -version
          swift --version
      - name: Resolve Swift package dependencies
        working-directory: macOs
        run: |
          swift package tools-version --set 5.9
          swift package resolve
      - name: Build macOS Swift executable (release)
        working-directory: macOs
        run: swift build --configuration release
      - name: Assemble DASCRM.app bundle
        run: |
          APP="$RUNNER_TEMP/DASCRM.app"
          BIN="macOs/.build/release/DASCRM"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/DASCRM"
          chmod +x "$APP/Contents/MacOS/DASCRM"
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>             <string>DASCRM</string>
            <key>CFBundleDisplayName</key>      <string>DAS CRM</string>
            <key>CFBundleIdentifier</key>       <string>com.dascrm.app</string>
            <key>CFBundleVersion</key>          <string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleExecutable</key>       <string>DASCRM</string>
            <key>CFBundlePackageType</key>      <string>APPL</string>
            <key>LSMinimumSystemVersion</key>   <string>12.0</string>
            <key>NSHighResolutionCapable</key>  <true/>
          </dict>
          </plist>
          PLIST
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DASCRM.dmg
        run: |
          DMG="$RUNNER_TEMP/DASCRM.dmg"
          APP="$RUNNER_TEMP/DASCRM.app"
          create-dmg \
            --volname "DAS CRM Installer" \
            --window-pos  200 120 \
            --window-size 660 400 \
            --icon-size   128 \
            --icon "DASCRM.app" 180 170 \
            --hide-extension "DASCRM.app" \
            --app-drop-link 480 170 \
            "$DMG" "$APP" || \
          hdiutil create -volname "DAS CRM" -srcfolder "$APP" -ov -format UDZO "$DMG"
          cp "$DMG" DASCRM.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-macOS
          path: DASCRM.dmg
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Release — attach all artifacts to a GitHub Release on version tags
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: "Publish GitHub Release"
    needs: [ build-windows-x64, build-windows-x86, build-windows-universal, build-macos ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: "DASCRM-*"
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: "DAS CRM ${{ github.ref_name }}"
          body: |
            ## DAS CRM ${{ github.ref_name }}

            ### Windows Downloads
            | Architecture | File | Best For |
            |---|---|---|
            | x86_64 | `DASCRM-x64.exe` | Modern 64-bit Windows PCs |
            | x86 (32-bit) | `DASCRM-x86.exe` | Older 32-bit Windows PCs |
            | Universal | `DASCRM-universal.exe` | All Windows PCs (larger file) |

            ### macOS
            | File | Description |
            |---|---|
            | `DASCRM.dmg` | Disk image — drag app to Applications |

            > Built automatically by GitHub Actions from commit `${{ github.sha }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
