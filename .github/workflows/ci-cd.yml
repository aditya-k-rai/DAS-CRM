name: DAS CRM Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build & Test Frontend Web
  build-frontend:
    name: Build & Test Frontend Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd frontend-web && npm install --legacy-peer-deps

      - name: Build Next.js Web App
        run: cd frontend-web && npm run build
        env:
          NEXT_PUBLIC_API_URL: 'https://nexcrm-backend.onrender.com'

  # Job 2: Build & Test SuperAdmin Web
  build-superadmin:
    name: Build & Test SuperAdmin Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd superadmin-web && npm install --legacy-peer-deps

      - name: Build Next.js SuperAdmin Web App
        run: cd superadmin-web && npm run build

  # Job 3: Build & Test Backend API
  build-backend:
    name: Build & Test Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd backend
          chmod -R +x node_modules/.bin || true
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

      - name: Build NestJS API
        run: |
          cd backend
          chmod -R +x node_modules/.bin || true
          npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

  # Job 4: Build Android Mobile APK (Gradle + React Native)
  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: cd android && npm install --legacy-peer-deps

      - name: Build APK via Gradle
        run: |
          cd android/android
          chmod +x gradlew
          # Build only arm64 to reduce memory pressure (faster build + less RAM)
          # Metaspace OOM fix: increase heap to 4g and metaspace to 1g
          export ORG_GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/android/app/build/outputs/apk/release/*.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/android/app/build/outputs/apk/release/*.apk
          name: '${{ github.ref_name }} — Official Release'
          body: |
            ### 🚀 DAS CRM Mobile App Production Release (${{ github.ref_name }})
            - **Mobile Stack**: Expo / React Native (Android Native Build)
            - **Build Source**: Compiled via GitHub Actions Automated CI/CD
            - **Installation**: Download `app-release.apk` below under **Assets** and install on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
