name: DAS CRM Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build & Test Frontend Web
  build-frontend:
    name: Build & Test Frontend Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd frontend-web && npm install --legacy-peer-deps

      - name: Build Next.js Web App
        run: cd frontend-web && npm run build
        env:
          NEXT_PUBLIC_API_URL: 'https://nexcrm-backend.onrender.com'

  # Job 2: Build & Test SuperAdmin Web
  build-superadmin:
    name: Build & Test SuperAdmin Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd superadmin-web && npm install --legacy-peer-deps

      - name: Build Next.js SuperAdmin Web App
        run: cd superadmin-web && npm run build

  # Job 3: Build & Test Backend API
  build-backend:
    name: Build & Test Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

      - name: Build NestJS API
        run: cd backend && npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

  # Job 4: Build Android Mobile APK (Gradle + React Native)
  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: cd android && npm install --legacy-peer-deps

      - name: Build APK via Gradle
        run: |
          cd android/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/android/app/build/outputs/apk/release/*.apk
