name: DAS CRM Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build & Test Frontend Web
  build-frontend:
    name: Build & Test Frontend Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd frontend-web && npm install --legacy-peer-deps

      - name: Build Next.js Web App
        run: cd frontend-web && npm run build
        env:
          NEXT_PUBLIC_API_URL: 'https://nexcrm-backend.onrender.com'

  # Job 2: Build & Test SuperAdmin Web
  build-superadmin:
    name: Build & Test SuperAdmin Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd superadmin-web && npm install --legacy-peer-deps

      - name: Build Next.js SuperAdmin Web App
        run: cd superadmin-web && npm run build

  # Job 3: Build & Test Backend API
  build-backend:
    name: Build & Test Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd backend
          chmod -R +x node_modules/.bin || true
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

      - name: Build NestJS API
        run: |
          cd backend
          chmod -R +x node_modules/.bin || true
          npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

  # Job 4: Build Android Mobile APKs — 3 architectures (Gradle + React Native)
  build-android:
    name: Build Android APKs (3 architectures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Mobile Dependencies
        run: cd android && npm install --legacy-peer-deps

      - name: Build APK 1/3 — arm64-v8a
        run: |
          cd android/android
          chmod +x gradlew
          export ORG_GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -PreactNativeArchitecturesOnly=true
          cp app/build/outputs/apk/release/*.apk ../app-arm64-v8a-release.apk
          echo "✓ arm64-v8a APK built"

      - name: Build APK 2/3 — armeabi-v7a
        run: |
          cd android/android
          chmod +x gradlew
          export ORG_GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a \
            -PreactNativeArchitecturesOnly=true
          cp app/build/outputs/apk/release/*.apk ../app-armeabi-v7a-release.apk
          echo "✓ armeabi-v7a APK built"

      - name: Build APK 3/3 — Universal (all architectures)
        run: |
          cd android/android
          chmod +x gradlew
          export ORG_GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64
          cp app/build/outputs/apk/release/*.apk ../app-universal-release.apk
          echo "✓ universal APK built"

      - name: List built APKs
        run: |
          echo "=== Built APKs ==="
          ls -lh android/*.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-arm64-v8a
          path: android/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-armeabi-v7a
          path: android/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-universal
          path: android/app-universal-release.apk
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app-arm64-v8a-release.apk
            android/app-armeabi-v7a-release.apk
            android/app-universal-release.apk
          name: '${{ github.ref_name }} — Official Release'
          body: |
            ### 🚀 DAS CRM Mobile App Production Release (${{ github.ref_name }})
            - **Mobile Stack**: Expo / React Native (Android Native Build)
            - **Build Source**: Compiled via GitHub Actions Automated CI/CD

            ### Downloads
            | Architecture | File | Best For |
            |---|---|---|
            | arm64-v8a | `app-arm64-v8a-release.apk` | Modern 64-bit Android devices (most phones) |
            | armeabi-v7a | `app-armeabi-v7a-release.apk` | 32-bit ARM devices |
            | Universal | `app-universal-release.apk` | All Android devices (larger file size) |

            ### Installation
            Download any APK from **Assets** below and install on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
