name: DAS CRM Monorepo CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build & Test Frontend Web
  build-frontend:
    name: Build & Test Frontend Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd frontend-web && npm install --legacy-peer-deps

      - name: Build Next.js Web App
        run: cd frontend-web && npm run build
        env:
          NEXT_PUBLIC_API_URL: 'https://nexcrm-backend.onrender.com'

  # Job 2: Build & Test SuperAdmin Web
  build-superadmin:
    name: Build & Test SuperAdmin Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd superadmin-web && npm install --legacy-peer-deps

      - name: Build Next.js SuperAdmin Web App
        run: cd superadmin-web && npm run build

  # Job 3: Build & Test Backend API
  build-backend:
    name: Build & Test Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd backend
          chmod -R +x node_modules/.bin || true
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

      - name: Build NestJS API
        run: |
          cd backend
          chmod -R +x node_modules/.bin || true
          npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dascrm?schema=public"

  # Job 4: Build Android Mobile Universal APK (Gradle + React Native)
  build-android:
    name: Build Android Universal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Accept Android SDK Licenses & Prepare NDK
        run: |
          yes | sdkmanager --licenses || true
          echo "Ensuring Android SDK Platform 36 and Build-Tools are installed..."
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true
          if [ ! -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
            echo "Installing NDK 27.1.12297006 via sdkmanager fallback..."
            sdkmanager --install "ndk;27.1.12297006" || true
          fi

      - name: Install Mobile Dependencies
        run: cd android && npm install --legacy-peer-deps

      - name: Prepare Mobile Environment Variables
        run: |
          cd android
          API_URL="${{ secrets.EXPO_PUBLIC_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://dascrm-backend.onrender.com/api/v1"
          fi
          echo "EXPO_PUBLIC_API_URL=$API_URL" > .env
          echo "✓ Configured android/.env with EXPO_PUBLIC_API_URL=$API_URL"

      - name: Build Single Universal APK (All Architectures)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://dascrm-backend.onrender.com/api/v1' }}
        run: |
          cd android/android
          chmod +x gradlew
          rm -rf app/build/outputs/apk
          export ORG_GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64 \
            -PreactNativeArchitecturesOnly=false
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Universal APK not found!" && exit 1
          fi
          cp "$APK_FILE" ../DAS-CRM-Universal.apk
          cp "$APK_FILE" ../app-universal-release.apk
          echo "✓ Universal APK built: $APK_FILE -> ../DAS-CRM-Universal.apk"

      - name: List built APKs
        run: |
          echo "=== Built APK ==="
          ls -lh android/*.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: DASCRM-Universal
          path: android/DAS-CRM-Universal.apk
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/DAS-CRM-Universal.apk
          name: '${{ github.ref_name }} — Official Release'
          body: |
            ### 🚀 DAS CRM Mobile App Production Release (${{ github.ref_name }})
            - **Mobile Stack**: Expo / React Native (Android Universal Build)
            - **Compatibility**: 100% compatible with all Android devices (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **Build Source**: Compiled via GitHub Actions Automated CI/CD

            ### Download
            - **[DAS-CRM-Universal.apk](DAS-CRM-Universal.apk)** (Single Universal All-in-One Installer)

            ### Installation Instructions
            1. Download `DAS-CRM-Universal.apk` to your Android device.
            2. If you have an earlier test build installed, **uninstall it first** to avoid signature conflicts.
            3. Tap the downloaded file to install. If prompted by Play Protect, tap **"More details"** → **"Install anyway"**.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
